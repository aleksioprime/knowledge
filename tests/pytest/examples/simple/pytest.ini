[pytest]
;Где искать тесты
testpaths = tests
;Шаблон для поиска тестов
python_files = "test_*.py"
; Дополнительные опции (-v — подробный вывод)
addopts = -v

; Регистрация пользовательских маркировок
markers =
    slow: медленные тесты (deselect with '-m "not slow"')
    fast: быстрые тесты
    integration: интеграционные тесты
    unit: юнит-тесты
    database: тесты с базой данных