services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Подключение к хранилищу задаётся переменной AIRFLOW_CONN_<ИМЯ>
      AIRFLOW_CONN_WAREHOUSE: postgresql://warehouse:warehouse@warehouse:5432/warehouse
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      warehouse:
        condition: service_healthy
