# docker compose -p kb-elk up -d --build
x-json-logs: &json-logs
  # Filebeat читает файлы json-file; в Docker Desktop по умолчанию драйвер local — его формат Filebeat не понимает
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  app:
    build: .
    <<: *json-logs

  nginx:
    image: nginx:1.27.3-alpine
    <<: *json-logs
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "48080:80"
    depends_on: [app]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"  # только для локального стенда
      xpack.ml.enabled: "false"  # машинное обучение не нужно, а память ест
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    ports:
      - "49200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -fs localhost:9200/_cluster/health || exit 1
      interval: 5s
      start_period: 60s
      retries: 60

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=512  # ограничение памяти для локального стенда
    mem_limit: 900m
    ports:
      - "45601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    user: root  # читает логи контейнеров и docker.sock
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./ilm-policy.json:/usr/share/filebeat/ilm-policy.json:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
