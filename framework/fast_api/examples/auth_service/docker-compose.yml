services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "45432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4
    ports:
      - "46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  api:
    build: .
    image: kb-auth-api
    environment:
      DATABASE_URL: postgresql+asyncpg://auth:auth@postgres:5432/auth
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production-please-32-bytes
    ports:
      - "48000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
