# Окружение для функциональных тестов: отдельные порты, чтобы не задеть данные разработки
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "29201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "26380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  api:
    # Тот же Dockerfile и то же имя образа, что в docker-compose.yml сервиса
    build: ../..
    image: kb-search-api
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    ports:
      - "28001:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 15

  tests:
    build: .
    environment:
      ELASTIC_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      SERVICE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
