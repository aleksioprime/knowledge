name: Сокращатель ссылок

on:
  push:
    branches: [main]
    paths: ['pet/shortener/**', '.github/workflows/shortener.yml']
  pull_request:
    paths: ['pet/shortener/**', '.github/workflows/shortener.yml']

defaults:
  run:
    working-directory: pet/shortener/app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pet/shortener/app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    # Поднимаем сервис целиком и проверяем, что миграции применились и перенаправление работает
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: pet/shortener
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: |
          code=$(curl -sf -X POST localhost:8001/api/links -H 'Content-Type: application/json' \
            -d '{"url": "https://example.com/"}' | jq -r .code)
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' localhost:8001/$code)" = "302 https://example.com/"
      - if: failure()
        run: docker compose logs app
