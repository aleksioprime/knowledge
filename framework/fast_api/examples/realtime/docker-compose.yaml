name: kb-ws

x-app: &app
  build: .
  image: kb-ws-app
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 2s
    retries: 15

services:
  redis:
    image: redis:7.4
    ports:
      - "46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  app1:
    <<: *app
    environment:
      INSTANCE: app1
      REDIS_URL: redis://redis:6379/0
    ports:
      - "41801:8000"

  app2:
    <<: *app
    environment:
      INSTANCE: app2
      REDIS_URL: redis://redis:6379/0
    ports:
      - "41802:8000"

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "41800:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
