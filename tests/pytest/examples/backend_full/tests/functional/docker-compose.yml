x-app: &app
  env_file:
    - .env.example

services:
  postgres_test:
    image: postgres:14
    container_name: functional-test-postgres
    platform: linux/amd64
    <<: *app
    volumes:
      - postgres_test_volume:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_test:
    image: redis:6
    container_name: functional-test-redis
    platform: linux/amd64
    <<: *app
    volumes:
      - redis_test_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app_test:
    build:
      context: ../../app
    container_name: functional-test-app
    <<: *app
    depends_on:
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    volumes:
        - ../../app:/app
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  tests:
    build:
      context: .
    container_name: tests
    <<: *app
    depends_on:
      app_test:
        condition: service_started
      postgres_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
    command: >
      sh -c "python utils/waiters.py && pytest"

volumes:
  postgres_test_volume:
  redis_test_volume: