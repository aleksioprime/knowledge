services:
  # Kafka в режиме KRaft (без ZooKeeper)
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9096:9096"  # Внешний порт для клиентов
    environment:
      # Основные настройки KRaft (обязательно!)
      KAFKA_PROCESS_ROLES: broker,controller        # Роли процесса
      KAFKA_NODE_ID: 1                              # Уникальный ID узла (должен быть уникален в кластере)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # Список контроллеров в формате nodeId@host:port

      # Слушатели (broker + controller)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096   # Порты для брокера и контроллера
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9096    # Адреса, по которому клиенты будут подключаться (kafka:9092 для внутреннего использования, 127.0.0.1:9096 для внешнего)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT  # Протоколы безопасности для слушателей

      # Автосоздание топиков
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Директории (Kafka требует указания путей в Kraft)
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Формат метаданных KRaft
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka UI от Provectus
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka              # Имя кластера в UI
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092  # Адрес Kafka брокера

volumes:
  kafka_data:
