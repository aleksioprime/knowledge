name: kb-mail

services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_TLS_CERT: "sans:localhost"
      MP_SMTP_TLS_KEY: "sans:localhost"
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '@(example\.com|tasker\.test)$$'
      MP_MAX_MESSAGES: "2000"
      MP_ENABLE_CHAOS: "true"
    ports:
      - "127.0.0.1:41025:1025"
      - "127.0.0.1:48025:8025"
    mem_limit: 128m
