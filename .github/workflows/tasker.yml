name: Задачник

on:
  push:
    branches: [main]
    paths: ['pet/tasker/**', '.github/workflows/tasker.yml']
  pull_request:
    paths: ['pet/tasker/**', '.github/workflows/tasker.yml']

defaults:
  run:
    working-directory: pet/tasker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasker"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pet/tasker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  api:
    # Поднимаем всё приложение в Docker и проверяем его снаружи коллекцией Postman
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: |
          docker run --rm --network host -v "$PWD/postman":/etc/newman postman/newman:6-alpine \
            run tasker.postman_collection.json --env-var baseUrl=http://localhost:8000
      - if: failure()
        run: docker compose logs app
